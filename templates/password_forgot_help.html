{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - StockWise</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --primary-dark: #4f46e5;
            --gray-50: #f9fafb;
            --gray-200: #e5e7eb;
            --gray-300: #d1d5db;
            --gray-400: #9ca3af;
            --gray-600: #4b5563;
            --gray-900: #111827;
        }
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-container { width: 100%; max-width: 440px; }
        .login-card {
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
            padding: 2rem 2.25rem;
            border: 1px solid var(--gray-200);
        }
        .login-header { text-align: center; margin-bottom: 1.5rem; }
        .login-logo {
            display: inline-flex; align-items: center; justify-content: center;
            width: 56px; height: 56px;
            background: linear-gradient(135deg, var(--primary) 0%, var(--primary-dark) 100%);
            border-radius: 14px; margin-bottom: 1rem; color: #fff;
        }
        .form-floating { margin-bottom: 1.1rem; }
        .form-floating .form-control {
            height: 52px; border: 1.5px solid var(--gray-300); border-radius: 12px;
            font-size: 0.9375rem; background: var(--gray-50); padding: 1rem 1rem; color: var(--gray-900);
        }
        .form-floating .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            background: #fff;
        }
        .login-actions { display: flex; gap: .5rem; align-items: center; }
        .no-floating .form-control {
            height: 52px; border: 1.5px solid var(--gray-300); border-radius: 12px;
            font-size: 0.9375rem; background: var(--gray-50); padding: 1rem 1rem; color: var(--gray-900);
        }
        .no-floating .form-control:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99,102,241,0.1);
            background: #fff;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-card">
            <div class="login-header">
                <div class="login-logo"><i class="bi bi-shield-lock"></i></div>
                <h1 class="login-title h4 mb-1">Forgot your password?</h1>
                <p class="text-muted mb-0">Enter your email to receive a recovery code.</p>
            </div>

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-{{ message.tags }}">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <form method="post" class="login-form">
                {% csrf_token %}
                <div class="no-floating mb-3">
                    <label class="visually-hidden" for="email">Email address</label>
                    <input type="email" class="form-control" id="email" name="email" value="{{ submitted_email|default:'' }}" aria-label="Email address" required autocomplete="email">
                </div>
                <div class="login-actions">
                    <button type="submit" class="btn btn-primary">Send Recovery Code</button>
                    <a class="btn btn-outline-secondary" href="{% url 'login' %}">Back to login</a>
                </div>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
