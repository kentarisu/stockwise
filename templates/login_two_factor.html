{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StockWise - Verify Code</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <style>
        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1rem;
        }
        .login-card {
            width: 100%;
            max-width: 420px;
            background: #fff;
            border-radius: 24px;
            padding: 2.5rem;
            box-shadow: 0 30px 60px rgba(64, 69, 75, 0.15);
            border: 1px solid rgba(99, 102, 241, 0.08);
        }
        .login-logo {
            width: 64px;
            height: 64px;
            margin: 0 auto 1.25rem;
            border-radius: 16px;
            background: linear-gradient(135deg, #6366f1, #4f46e5);
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
        }
        .verify-title {
            text-align: center;
            font-weight: 700;
            font-size: 1.75rem;
            margin-bottom: 0.35rem;
            color: #111827;
        }
        .verify-subtitle {
            text-align: center;
            color: #4b5563;
            margin-bottom: 1.75rem;
            font-size: 0.95rem;
        }
        .code-input {
            letter-spacing: 0.5rem;
            font-size: 1.25rem;
            text-align: center;
        }
        .btn-primary {
            width: 100%;
            height: 48px;
            border-radius: 12px;
            font-weight: 600;
            background: #6366f1;
            border: none;
        }
        .resend-link {
            margin-top: 1rem;
            text-align: center;
            font-size: 0.9rem;
        }
        .resend-link button {
            background: none;
            border: none;
            color: #4f46e5;
            font-weight: 600;
            cursor: pointer;
        }
        .alert {
            border-radius: 12px;
            border: none;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="login-logo">
            <i class="bi bi-shield-lock-fill"></i>
        </div>
        <h1 class="verify-title">Enter Verification Code</h1>
        <p class="verify-subtitle">
            We sent a 6-digit code to <strong>{{ masked_email }}</strong>. Enter it below to finish signing in.
        </p>

        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
                    {{ message }}
                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" id="twoFactorForm">
            {% csrf_token %}
            <div class="mb-3">
                <label for="code" class="form-label">Verification Code</label>
                <input type="text" maxlength="6" minlength="6" pattern="\d{6}" class="form-control code-input" id="code" name="code" placeholder="123456" required autocomplete="one-time-code">
            </div>
            <button type="submit" class="btn btn-primary" id="verifyBtn">Verify &amp; Continue</button>
        </form>

        <form method="post" class="resend-link">
            {% csrf_token %}
            <input type="hidden" name="resend_code" value="1">
            <span>Didn't get the code?</span>
            <button type="submit">Resend code</button>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
