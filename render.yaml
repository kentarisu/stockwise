services:
  # Web service (Django app)
  - type: web
    name: stockwise-web
    env: python
    plan: starter  # You can change to standard or pro based on your needs
    buildCommand: pip install -r requirements.txt && python manage.py migrate --noinput && python manage.py collectstatic --noinput
    startCommand: gunicorn stockwise_py.wsgi:application --bind 0.0.0.0:$PORT --workers 3 --timeout 120
    dockerfilePath: ""  # Use buildpacks, not Dockerfile
    disk:
      name: stockwise-media
      mountPath: /opt/render/project/src/media
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DEBUG
        value: false
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: stockwise-db
          property: connectionString
      - key: MEDIA_ROOT
        value: /opt/render/project/src/media
      - key: MAINTENANCE_MODE
        value: false
      - key: DISABLE_CSRF
        value: false
      - key: IPROG_API_TOKEN
        sync: false  # Set this manually in Render dashboard (same value as worker)
      - key: IPROG_SENDER_NAME
        value: kaprets  # Always use 'kaprets' for all SMS
    healthCheckPath: /
    autoDeploy: true

  # Background worker (SMS scheduler)
  - type: worker
    name: stockwise-worker
    env: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python sms_scheduler.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11
      - key: DATABASE_URL
        fromDatabase:
          name: stockwise-db
          property: connectionString
      - key: SECRET_KEY
        sync: true
      - key: IPROG_API_TOKEN
        sync: false  # Set this manually in Render dashboard
      - key: IPROG_SENDER_NAME
        value: kaprets  # Always use 'kaprets' for all SMS
      - key: ENABLE_INTERNAL_SCHEDULER
        value: false  # Worker runs as separate process, so internal scheduler not needed

databases:
  - name: stockwise-db
    plan: starter  # You can upgrade to standard or pro for better performance
    databaseName: stockwise
    user: stockwise_user

